<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>go-rammarly</title>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Tailwind & HTMX -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#FDF7F7',
            primary: '#000000',
            secondary: '#6C6C6C',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            // Remove the old shimmer & pulse if not used.
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out forwards',
          },
        },
      },
    }
  </script>

  <style>
    body {
      background-color: #FDF7F7;
    }

    .skeleton-loader {
      display: flex;
      gap: 8px;
    }

    /* Updated typing indicator animation */
    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.2;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-5px);
      }
    }
    .skeleton-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #e2e2e2;
      animation: typing 1.5s ease-in-out infinite;
    }
    .skeleton-dot:nth-child(1) {
      animation-delay: 0s;
    }
    .skeleton-dot:nth-child(2) {
      animation-delay: 0.2s;
    }
    .skeleton-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    .upload-overlay {
      transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
    }

    /* Messages fade-in transition */
    .message {
      opacity: 0;
      transform: translateY(10px);
    }
    .message.show {
      animation: fadeIn 0.5s ease-out forwards;
    }

    .copy-button {
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    .response-container:hover .copy-button {
      opacity: 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .markdown p {
      margin-bottom: 0.75rem;
    }

    .markdown ul, .markdown ol {
      margin-left: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .markdown ul {
      list-style-type: disc;
    }

    .markdown ol {
      list-style-type: decimal;
    }

    .markdown code {
      font-family: monospace;
      background-color: #f0f0f0;
      padding: 0.125rem 0.25rem;
      border-radius: 0.25rem;
    }
    
    .custom-blur {
      backdrop-filter: blur(8px); /* Adjust the px value for your desired effect */
      -webkit-backdrop-filter: blur(8px);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col">
  <header class="w-full p-4 flex justify-between items-center fixed top-0 bg-background/80 custom-blur rounded-b-lg z-50">
    <h1 class="text-xl font-semibold">go-rammarly</h1>
    <div>
      {{if .User}}
        <div class="flex items-center gap-4">
          <button onclick="toggleHistory()" class="px-3 py-1.5 text-sm font-medium hover:bg-black/5 rounded-lg transition-colors">
            History
          </button>
          <a href="/logout" class="px-3 py-1.5 text-sm font-medium hover:bg-black/5 rounded-lg transition-colors">
            Logout
          </a>
          <img src="{{.User.Picture}}" alt="Profile" class="w-8 h-8 rounded-full">
        </div>
      {{else}}
        <a href="/auth/google" class="px-4 py-2 bg-black text-white rounded-lg hover:bg-opacity-90 transition-colors flex items-center gap-2">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Sign in
        </a>
      {{end}}
    </div>
  </header>

  <main class="flex-grow container mx-auto max-w-3xl px-4 pt-20 pb-32">
    <div class="mb-8">
      <h2 class="text-4xl font-semibold mb-6">refine your text and analyze your images</h2>
    </div>

    <!-- Messages Container -->
    <div id="messages-container" class="space-y-6">
      <!-- Messages will be inserted here -->
    </div>
  </main>

  <div class="fixed bottom-0 w-full bg-background/80 custom-blur py-6 rounded-t-lg">
    <div class="container mx-auto max-w-3xl px-4">
      <div class="relative">
        <!-- Image Upload Overlay -->
        <div id="upload-overlay" class="upload-overlay absolute bottom-full left-0 right-0 mb-4 bg-white rounded-lg shadow-lg p-4 opacity-0 pointer-events-none transform translate-y-2">
          <form id="image-form"
                hx-post="/analyze-image"
                hx-swap="none"
                enctype="multipart/form-data"
                class="space-y-4">
            <div class="border-2 border-dashed border-gray-200 rounded-lg p-6 text-center hover:border-gray-300 transition-colors">
              <label for="image-input" class="cursor-pointer block">
                <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <p class="mt-2 text-sm text-gray-600">Click to upload or drag and drop</p>
                <p class="mt-1 text-xs text-gray-500">PNG, JPG, GIF up to 10MB</p>
              </label>
              <input type="file"
                     id="image-input"
                     name="image"
                     accept="image/*"
                     class="hidden"
                     onchange="handleImageUpload(this)">
            </div>
            <div id="image-preview" class="hidden">
              <img id="preview-img" src="#" alt="Preview" class="max-h-48 mx-auto rounded-lg">
              <button type="button" onclick="clearImageUpload()" class="mt-2 text-sm text-red-500 hover:text-red-600">
                Remove
              </button>
            </div>
            <div class="flex justify-end">
              <button type="submit"
                      id="image-submit-btn"
                      class="px-4 py-2 bg-black text-white rounded-lg hover:bg-opacity-90 transition-colors"
                      disabled>
                Analyze Image
              </button>
            </div>
          </form>
        </div>

        <form id="text-form"
              hx-post="/generate"
              hx-swap="none"
              class="flex items-center gap-2 bg-white rounded-xl shadow-sm p-2">

          <button type="button" 
                  onclick="toggleUploadOverlay()"
                  class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
          </button>
          <input type="text"
                 id="text-input"
                 name="text"
                 class="flex-grow px-3 py-2 outline-none"
                 placeholder="Message go-rammarly..."
                 autocomplete="off">
          <button type="submit"
                  disabled
                  class="p-2 hover:bg-gray-100 rounded-lg transition-colors disabled:opacity-50">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // DOM Elements
    const textInput = document.getElementById('text-input');
    const textForm = document.getElementById('text-form');
    const submitBtn = textForm.querySelector('button[type="submit"]');
    const uploadOverlay = document.getElementById('upload-overlay');
    const imageForm = document.getElementById('image-form');
    const imageSubmitBtn = document.getElementById('image-submit-btn');
    const messagesContainer = document.getElementById('messages-container');

    // Toggle upload overlay
    let isUploadOverlayVisible = false;
    function toggleUploadOverlay() {
      isUploadOverlayVisible = !isUploadOverlayVisible;
      uploadOverlay.style.opacity = isUploadOverlayVisible ? '1' : '0';
      uploadOverlay.style.transform = isUploadOverlayVisible ? 'translateY(0)' : 'translateY(2px)';
      uploadOverlay.style.pointerEvents = isUploadOverlayVisible ? 'auto' : 'none';
    }

    // Handle text input
    textInput.addEventListener('input', () => {
      submitBtn.disabled = !textInput.value.trim();
    });

    // Create message elements
    function createUserMessage(content, type = 'text') {
      const div = document.createElement('div');
      div.className = 'flex justify-end message';
      div.innerHTML = `
        <div class="max-w-[80%] bg-black text-white rounded-2xl rounded-tr-sm px-4 py-2">
          ${type === 'image' 
            ? `<img src="${content}" alt="Uploaded image" class="max-h-48 rounded-lg">`
            : `<p>${content}</p>`
          }
        </div>
      `;
      return div;
    }

    function createBotMessage(content) {
      const div = document.createElement('div');
      div.className = 'flex message';

      // Format the content and prepare for copy functionality
      const formattedContent = formatResponse(content);
      
      div.innerHTML = `
        <div class="max-w-[80%] bg-white shadow-sm rounded-2xl rounded-tl-sm px-4 py-3 response-container relative">
          <div class="markdown pr-6">${formattedContent}</div>
          <button onclick="copyToClipboard(this)" class="copy-button absolute top-2 right-2 p-1.5 hover:bg-gray-100 rounded-md transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
          </button>
        </div>
      `;
      return div;
    }

    function createLoadingIndicator() {
      const div = document.createElement('div');
      div.className = 'flex message loading-indicator';
      div.innerHTML = `
        <div class="max-w-[80%] bg-white shadow-sm rounded-2xl rounded-tl-sm px-4 py-3">
          <div class="skeleton-loader py-1">
            <div class="skeleton-dot"></div>
            <div class="skeleton-dot"></div>
            <div class="skeleton-dot"></div>
          </div>
        </div>
      `;
      return div;
    }

    // Format the response with proper markdown and styling
    function formatResponse(text) {
      // Remove any "Corrected Text" prefix
      text = text.replace(/^(Corrected Text|Copy)\s*/, '');
      
      // Preserve formatting for code blocks
      text = text.replace(/```([\s\S]*?)```/g, function(match, code) {
        return `<pre><code>${code}</code></pre>`;
      });

      // Convert markdown-style lists
      text = text.replace(/^\s*-\s+(.*)/gm, '<li>$1</li>');
      text = text.replace(/<li>(.*?)<\/li>/g, function(match) {
        return '<ul>' + match + '</ul>';
      });
      text = text.replace(/<\/ul><ul>/g, '');

      // Convert markdown-style bold text
      text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      
      // Convert markdown-style italic text
      text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
      
      // Convert line breaks to paragraphs
      const paragraphs = text.split(/\n\s*\n/);
      return paragraphs.map(p => {
        if (!p.trim()) return '';
        if (p.includes('<pre>')) return p;
        if (p.includes('<ul>')) return p;
        return `<p>${p.replace(/\n/g, ' ')}</p>`;
      }).join('');
    }

    // Copy to clipboard functionality
    function copyToClipboard(button) {
      const container = button.closest('.response-container');
      const contentElement = container.querySelector('.markdown');
      const text = contentElement.innerText;
      
      navigator.clipboard.writeText(text).then(() => {
        // Show success indicator
        const originalSVG = button.innerHTML;
        button.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        `;
        
        // Revert back after 2 seconds
        setTimeout(() => {
          button.innerHTML = originalSVG;
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
    }

    // Handle image upload
    function handleImageUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const previewImg = document.getElementById('preview-img');
          const previewContainer = document.getElementById('image-preview');
          previewImg.src = e.target.result;
          previewContainer.classList.remove('hidden');
          imageSubmitBtn.disabled = false;
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function clearImageUpload() {
      const previewContainer = document.getElementById('image-preview');
      const imageInput = document.getElementById('image-input');
      previewContainer.classList.add('hidden');
      imageInput.value = '';
      imageSubmitBtn.disabled = true;
    }

    // HTMX Events
    document.body.addEventListener('htmx:beforeRequest', (event) => {
      const form = event.detail.elt;
      const isTextForm = form.id === 'text-form';
      
      // Add user message
      const userContent = isTextForm ? textInput.value : URL.createObjectURL(form.image.files[0]);
      const userMessage = createUserMessage(userContent, isTextForm ? 'text' : 'image');
      messagesContainer.appendChild(userMessage);
      setTimeout(() => userMessage.classList.add('show'), 0);

      // Add loading indicator
      const loadingIndicator = createLoadingIndicator();
      loadingIndicator.id = 'current-loading-indicator';
      messagesContainer.appendChild(loadingIndicator);
      setTimeout(() => loadingIndicator.classList.add('show'), 0);

      // Clear input
      if (isTextForm) {
        textInput.value = '';
        submitBtn.disabled = true;
      } else {
        clearImageUpload();
        toggleUploadOverlay();
      }

      // Scroll to bottom
      window.scrollTo(0, document.body.scrollHeight);
    });

    document.body.addEventListener('htmx:afterRequest', (event) => {
      // Remove loading indicator
      const loadingIndicator = document.getElementById('current-loading-indicator');
      if (loadingIndicator) {
        loadingIndicator.remove();
      }

      // Extract and add bot response
      const responseText = extractResponseText(event.detail.xhr.response);
      const botMessage = createBotMessage(responseText);
      messagesContainer.appendChild(botMessage);
      setTimeout(() => botMessage.classList.add('show'), 0);

      // Scroll to bottom
      window.scrollTo(0, document.body.scrollHeight);
    });

    // Extract response text from HTML - FIXED to properly handle the response format from Go handlers
    function extractResponseText(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  
  // Try to get content from grammar-result or image-result
  const resultElement = doc.querySelector('#grammar-result, #image-result');
  let text = "";

  if (resultElement) {
    const resultTextElement = resultElement.querySelector('.result-text');
    if (resultTextElement) {
      text = resultTextElement.textContent.trim();
    }
  }

  // If not found, try a fallback extraction
  if (!text) {
    const divs = doc.querySelectorAll('div');
    for (const div of divs) {
      if (div.textContent && div.textContent.trim() !== '') {
        text = div.textContent.trim();
        break;
      }
    }
  }

  // Remove a trailing curly bracket if it exists
  if (text.endsWith('}')) {
    text = text.slice(0, -1).trim();
  }
  
  return text || "No response received. Please try again.";
}


    // Close upload overlay when clicking outside
    document.addEventListener('click', (event) => {
      if (isUploadOverlayVisible && !uploadOverlay.contains(event.target) && !event.target.closest('button[onclick="toggleUploadOverlay()"]')) {
        toggleUploadOverlay();
      }
    });

    // Toggle history (placeholder)
    function toggleHistory() {
      alert('History feature coming soon!');
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Focus on text input
      textInput.focus();
    });
  </script>
</body>
</html>
