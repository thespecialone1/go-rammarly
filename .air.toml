# Root directory of your project
root = "."
# Directory for temporary build files
tmp_dir = "tmp"

[build]
# Build command pointing to your main.go location
cmd = "go build -o /Users/lahrasab/VS\\ Code/golang/go-rammarly/tmp/main ./cmd/app/main.go"
# Binary output path
bin = "/Users/lahrasab/VS\\ Code/golang/go-rammarly/tmp/main"
# File extensions to watch for changes
include_ext = ["go", "tpl", "tmpl", "html"]
# Directories to exclude from watching
exclude_dir = ["tmp", "vendor", "node_modules", ".git"]
# Delay in milliseconds to account for filesystem differences
delay = 2000
# Stop the process on build errors
stop_on_error = true
# Enable or disable logging of build output
log_build_output = true

[log]
# Disable timestamps in logs
time = false

[color]
# Customize colors for better readability
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
