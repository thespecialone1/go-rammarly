root = "."
tmp_dir = "tmp"

[build]
# Build command pointing to your main.go location
cmd = "go build -o ./tmp/main ./cmd/app/main.go"
bin = "tmp/main"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "node_modules"]
# Set delay to account for filesystem differences
delay = 2000
stop_on_error = true

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"